<app-card><div class="card-top">@if (service.featured) {<app-badge>{{ i18n.t('common.featured') }}</app-badge>}</div><h3>{{ i18n.localize(service.title) }}</h3><p>{{ i18n.localize(service.shortDescription) }}</p><p class="muted">{{ i18n.localize(service.businessValue) }}</p><div class="tag-row">@for (tool of service.tools; track tool) {<span>{{ tool }}</span>}</div><app-button [href]="service.cta.href" variant="secondary" [trackingId]="service.cta.trackingId">{{ i18n.localize(service.cta.label) }}</app-button></app-card>
