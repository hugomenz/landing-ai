<section id="contact" class="section contact"><div class="container split"><div><p class="eyebrow">Contact</p><h2>{{ i18n.localize(contact.headline) }}</h2><p>{{ i18n.localize(contact.explanation) }}</p><p class="muted">{{ i18n.localize(contact.expectedResponseTime) }}</p><div class="actions"><app-button [href]="booking?.url || '#'" [external]="true">{{ i18n.localize(config.hero.primaryCta.label) }}</app-button><app-button [href]="email?.url || '#'" variant="secondary">Email</app-button></div><div class="badge-list">@for (type of contact.preferredProjectTypes; track $index) {<app-badge>{{ i18n.localize(type) }}</app-badge>}</div></div><app-contact-form /></div></section>
