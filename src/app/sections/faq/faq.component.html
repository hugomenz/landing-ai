<section class="section"><div class="container narrow"><app-section-header [eyebrow]="i18n.t('sections.faq.eyebrow')" [title]="i18n.t('sections.faq.title')" [description]="i18n.t('sections.faq.description')" />@for (item of faq; track item.id) {<details class="faq-item"><summary>{{ i18n.localize(item.question) }}</summary><p>{{ i18n.localize(item.answer) }}</p></details>}</div></section>
