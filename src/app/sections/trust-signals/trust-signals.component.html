<section class="section"><div class="container"><app-section-header [eyebrow]="i18n.t('sections.trust.eyebrow')" [title]="i18n.t('sections.trust.title')" [description]="i18n.t('sections.trust.description')" /><div class="grid cards-4">@for (item of items; track item.id) {<app-card><span class="card-icon">{{ item.iconKey }}</span><h3>{{ i18n.localize(item.title) }}</h3><p>{{ i18n.localize(item.description) }}</p></app-card>}</div></div></section>
