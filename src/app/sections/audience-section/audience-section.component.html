<section class="section"><div class="container"><app-section-header [eyebrow]="i18n.t('sections.audience.eyebrow')" [title]="i18n.t('sections.audience.title')" [description]="i18n.t('sections.audience.description')" /><div class="grid cards-3">@for (item of audience; track item.id) {<app-card><h3>{{ i18n.localize(item.title) }}</h3><p>{{ i18n.localize(item.typicalProblem) }}</p><p class="muted">{{ i18n.localize(item.howICanHelp) }}</p></app-card>}</div></div></section>
