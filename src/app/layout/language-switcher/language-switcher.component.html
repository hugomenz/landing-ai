<div class="language-switcher" aria-label="Language switcher">
  @for (language of languages; track language.code) {
    <button
      type="button"
      [class.active]="language.code === i18n.currentLanguage()"
      [attr.aria-label]="language.label"
      [attr.aria-pressed]="language.code === i18n.currentLanguage()"
      (click)="switch(language.code)"
    >
      <span aria-hidden="true">{{ flags[language.code] }}</span>
    </button>
  }
</div>
